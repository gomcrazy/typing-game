kind = "web"
previewPath = "/"
title = "타자 연습 게임"
version = "1.0.0"
id = "artifacts/typing-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25459

[services.development]
run = "pnpm --filter @workspace/typing-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/typing-game", "run", "build" ]
publicDir = "artifacts/typing-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25459"
BASE_PATH = "/"
